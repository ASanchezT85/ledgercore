# LedgerCore local development stack (Compose v2 — no top-level "version:").
#
# Everything here is DEV ONLY: credentials, disabled auth and the Traefik
# dashboard must never reach any shared environment.
#
# Usage (from the repo root):
#   docker compose -f infra/compose/docker-compose.yml up -d --build
#   docker compose -f infra/compose/docker-compose.yml --profile web --profile obs up -d --build
#
# Profiles:
#   (none) -> postgres + nats + gateway + the four Go services
#   web    -> adds the console (Next.js, port 3000)
#   obs    -> adds grafana/otel-lgtm (Grafana on 3100, OTLP on 4317/4318)

name: ledgercore

services:
  # --------------------------------------------------------------------- #
  # Infrastructure                                                        #
  # --------------------------------------------------------------------- #
  postgres:
    image: postgres:17-alpine
    environment:
      # The image creates the "ledgercore" database on first init; the
      # application role (ledgercore_app) and the per-service schemas are
      # created by infra/postgres/init/01-init.sql. Superuser is dev-only.
      POSTGRES_DB: ledgercore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Per-role passwords consumed by init/01-init.sql via psql \getenv (R-003).
      # Dev DEFAULTS here so a bare `docker compose up` works; the sandbox
      # overlay makes them REQUIRED so production never boots with these values.
      LEDGERCORE_MIGRATOR_PASSWORD: "${LEDGERCORE_MIGRATOR_PASSWORD:-ledgercore_migrator_dev}"
      LEDGERCORE_LEDGER_RT_PASSWORD: "${LEDGERCORE_LEDGER_RT_PASSWORD:-ledgercore_ledger_rt_dev}"
      LEDGERCORE_IDENTITY_RT_PASSWORD: "${LEDGERCORE_IDENTITY_RT_PASSWORD:-ledgercore_identity_rt_dev}"
      LEDGERCORE_RECON_RT_PASSWORD: "${LEDGERCORE_RECON_RT_PASSWORD:-ledgercore_recon_rt_dev}"
      LEDGERCORE_WEBHOOKS_RT_PASSWORD: "${LEDGERCORE_WEBHOOKS_RT_PASSWORD:-ledgercore_webhooks_rt_dev}"
    ports:
      - "${LEDGERCORE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledgercore"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------- #
  # Migration one-shot (LC-014 / LC-002).                                 #
  # Runs every service's goose migrations as the OWNER/MIGRATOR role, then #
  # reassigns SECURITY DEFINER functions to ledgercore_maint and grants    #
  # EXECUTE to the runtime roles (infra/postgres/migrate/grants.sql).      #
  # Exits when done; the Go services below run with DDL-less runtime roles  #
  # (LEDGERCORE_AUTO_MIGRATE=false) and wait for it to complete.           #
  # The migrator password is the dev-only value seeded by 01-init.sql.     #
  # --------------------------------------------------------------------- #
  migrate:
    image: golang:1.26-alpine
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
      - go_cache:/go
    environment:
      GOFLAGS: "-mod=mod"
      MIGRATOR_DSN: "postgres://ledgercore_migrator:${LEDGERCORE_MIGRATOR_PASSWORD:-ledgercore_migrator_dev}@postgres:5432/ledgercore?sslmode=disable"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        apk add --no-cache postgresql-client >/dev/null
        export PATH="$$PATH:$$(go env GOPATH)/bin"
        command -v goose >/dev/null 2>&1 || go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
        goose -dir /repo/services/ledger-core/internal/adapters/postgres/migrations   postgres "$$MIGRATOR_DSN&search_path=ledger"   up
        goose -dir /repo/services/identity/internal/adapters/postgres/migrations       postgres "$$MIGRATOR_DSN&search_path=identity" up
        goose -dir /repo/services/reconciliation/internal/adapters/postgres/migrations postgres "$$MIGRATOR_DSN&search_path=recon"    up
        goose -dir /repo/services/webhooks/internal/adapters/postgres/migrations       postgres "$$MIGRATOR_DSN&search_path=webhooks" up
        psql "$$MIGRATOR_DSN" -v ON_ERROR_STOP=1 -f /repo/infra/postgres/migrate/grants.sql
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  nats:
    image: nats:2.10-alpine
    # -js enables JetStream, -m 8222 enables the HTTP monitoring endpoint.
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    image: traefik:v3.3
    command:
      # File provider instead of the docker provider: the docker socket is
      # not reliably reachable from a container on Docker Desktop (Windows),
      # so routing lives in traefik-dynamic.yml (kept in sync with services).
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      # Public entrypoint for API traffic.
      - "--entrypoints.web.address=:8080"
      # Dashboard entrypoint (dev only; api.insecure serves it unauthenticated).
      - "--entrypoints.traefik.address=:8090"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "${LEDGERCORE_GATEWAY_PORT:-8080}:8080" # API gateway
      - "${LEDGERCORE_TRAEFIK_DASHBOARD_PORT:-8090}:8090" # Traefik dashboard (dev only)
    volumes:
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - ledger-core
      - identity
      - reconciliation
      - webhooks

  # --------------------------------------------------------------------- #
  # Go services                                                           #
  # Build context is the REPO ROOT so each Dockerfile can copy libs/go    #
  # next to its own service module.                                       #
  # Routing priorities: specific prefixes (identity/recon/webhooks) win   #
  # with priority 100; ledger-core catches the rest of /v1 at priority 1. #
  # --------------------------------------------------------------------- #
  ledger-core:
    build:
      context: ../..
      dockerfile: services/ledger-core/Dockerfile
    environment:
      LEDGERCORE_HTTP_ADDR: ":8081"
      # Runtime role: DML-only on the ledger schema, NOBYPASSRLS, no DDL.
      LEDGERCORE_DATABASE_URL: "postgres://ledgercore_ledger_rt:${LEDGERCORE_LEDGER_RT_PASSWORD:-ledgercore_ledger_rt_dev}@postgres:5432/ledgercore?search_path=ledger"
      LEDGERCORE_NATS_URL: "nats://nats:4222"
      LEDGERCORE_JWKS_URL: "http://identity:8082/.well-known/jwks.json"
      # Migrations run in the `migrate` one-shot as the owner role; runtime
      # never applies DDL.
      LEDGERCORE_AUTO_MIGRATE: "false"
      # dev only: tenant comes from X-Tenant-Id. Override with
      # LEDGERCORE_AUTH_DISABLED=false to exercise real JWT auth via JWKS.
      LEDGERCORE_AUTH_DISABLED: "${LEDGERCORE_AUTH_DISABLED:-true}"
    ports:
      - "${LEDGERCORE_LEDGER_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ledger-core.entrypoints=web"
      - "traefik.http.routers.ledger-core.rule=PathPrefix(`/v1`)"
      - "traefik.http.routers.ledger-core.priority=1"
      - "traefik.http.services.ledger-core.loadbalancer.server.port=8081"

  identity:
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
    environment:
      LEDGERCORE_HTTP_ADDR: ":8082"
      # Runtime role: DML-only on the identity schema, NOBYPASSRLS, no DDL.
      LEDGERCORE_DATABASE_URL: "postgres://ledgercore_identity_rt:${LEDGERCORE_IDENTITY_RT_PASSWORD:-ledgercore_identity_rt_dev}@postgres:5432/ledgercore?search_path=identity"
      LEDGERCORE_NATS_URL: "nats://nats:4222"
      LEDGERCORE_JWKS_URL: "http://identity:8082/.well-known/jwks.json"
      LEDGERCORE_AUTO_MIGRATE: "false"
      LEDGERCORE_AUTH_DISABLED: "true"
      # Bootstrap token for system-level endpoints (create tenants/API keys).
      LEDGERCORE_ADMIN_TOKEN: "dev-admin-token"
      # Dev-only master key (encrypts signing keys at rest; see keycrypt).
      # Overridable so a stack that already re-encrypted with a custom key
      # keeps decrypting. NEVER reuse this value outside local dev.
      LEDGERCORE_MASTER_KEY: "${LEDGERCORE_MASTER_KEY:-6465762d6f6e6c792d6d61737465722d6b65792d33322d62797465732d646576}"
    ports:
      - "${LEDGERCORE_IDENTITY_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.identity.entrypoints=web"
      - "traefik.http.routers.identity.rule=PathPrefix(`/v1/auth`) || PathPrefix(`/v1/tenants`) || PathPrefix(`/v1/api-keys`) || PathPrefix(`/.well-known`)"
      - "traefik.http.routers.identity.priority=100"
      - "traefik.http.services.identity.loadbalancer.server.port=8082"

  reconciliation:
    build:
      context: ../..
      dockerfile: services/reconciliation/Dockerfile
    environment:
      LEDGERCORE_HTTP_ADDR: ":8083"
      # Runtime role: DML-only on the recon schema, NOBYPASSRLS, no DDL.
      LEDGERCORE_DATABASE_URL: "postgres://ledgercore_recon_rt:${LEDGERCORE_RECON_RT_PASSWORD:-ledgercore_recon_rt_dev}@postgres:5432/ledgercore?search_path=recon"
      LEDGERCORE_NATS_URL: "nats://nats:4222"
      LEDGERCORE_JWKS_URL: "http://identity:8082/.well-known/jwks.json"
      LEDGERCORE_AUTO_MIGRATE: "false"
      LEDGERCORE_AUTH_DISABLED: "true"
    ports:
      - "${LEDGERCORE_RECON_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reconciliation.entrypoints=web"
      - "traefik.http.routers.reconciliation.rule=PathPrefix(`/v1/reconciliation`)"
      - "traefik.http.routers.reconciliation.priority=100"
      - "traefik.http.services.reconciliation.loadbalancer.server.port=8083"

  webhooks:
    build:
      context: ../..
      dockerfile: services/webhooks/Dockerfile
    environment:
      LEDGERCORE_HTTP_ADDR: ":8084"
      # Runtime role: DML-only on the webhooks schema, NOBYPASSRLS, no DDL.
      LEDGERCORE_DATABASE_URL: "postgres://ledgercore_webhooks_rt:${LEDGERCORE_WEBHOOKS_RT_PASSWORD:-ledgercore_webhooks_rt_dev}@postgres:5432/ledgercore?search_path=webhooks"
      LEDGERCORE_NATS_URL: "nats://nats:4222"
      LEDGERCORE_JWKS_URL: "http://identity:8082/.well-known/jwks.json"
      LEDGERCORE_AUTO_MIGRATE: "false"
      LEDGERCORE_AUTH_DISABLED: "true"
      # Webhooks encrypts subscription secrets at rest (AES-256-GCM) and refuses
      # to start in sandbox-public without this key (R-002). Same key + syntax
      # as identity; dev default here, REQUIRED in the sandbox overlay.
      LEDGERCORE_MASTER_KEY: "${LEDGERCORE_MASTER_KEY:-6465762d6f6e6c792d6d61737465722d6b65792d33322d62797465732d646576}"
    ports:
      - "${LEDGERCORE_WEBHOOKS_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webhooks.entrypoints=web"
      - "traefik.http.routers.webhooks.rule=PathPrefix(`/v1/webhook-subscriptions`) || PathPrefix(`/v1/webhook-deliveries`)"
      - "traefik.http.routers.webhooks.priority=100"
      - "traefik.http.services.webhooks.loadbalancer.server.port=8084"

  # --------------------------------------------------------------------- #
  # Web console (profile: web)                                            #
  # --------------------------------------------------------------------- #
  console:
    build:
      # The console Dockerfile expects the REPO ROOT as build context
      # (same convention as the Go services).
      context: ../..
      dockerfile: apps/console/Dockerfile
    environment:
      # Read server-side at request time (pages are force-dynamic); inside the
      # compose network the gateway is reachable by service name.
      NEXT_PUBLIC_API_URL: "http://gateway:8080"
      # on the money schemas — see infra/postgres/init/01-init.sql step 6.
      # Salt for the visitor/author hashes: we never store a raw IP.
      # Operator secret for /moderation. Unset => the panel answers 503 and
      # nobody can moderate; it is never the tenant API key.
    ports:
      - "${LEDGERCORE_CONSOLE_PORT:-3000}:3000"
    profiles: ["web"]
    depends_on:
      - gateway
      - postgres

  # --------------------------------------------------------------------- #
  # Observability, all-in-one (profile: obs)                              #
  # Grafana on http://localhost:3100 — OTLP gRPC 4317 / HTTP 4318.        #
  # Point services at it with OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
  # (unset by default: the OTel SDK stays no-op).                         #
  # --------------------------------------------------------------------- #
  otel-lgtm:
    image: grafana/otel-lgtm
    ports:
      - "3100:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    profiles: ["obs"]

volumes:
  postgres_data:
  # Go module + build cache for the `migrate` one-shot, so goose is installed
  # once and reused across `up` runs instead of re-downloaded each time.
  go_cache:
