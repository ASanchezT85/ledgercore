# PUBLIC SANDBOX overlay (Fase 1a) — apply ON TOP of docker-compose.yml on
# the VPS:
#
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.sandbox.yml \
#                  --profile web up -d --build
#
# Required host environment (see docs/runbook-vps.md):
#   LEDGERCORE_DOMAIN       public FQDN (e.g. sandbox.ledgercore.dev)
#   LEDGERCORE_ADMIN_TOKEN  strong random token (openssl rand -hex 32)
#   LEDGERCORE_MASTER_KEY   32-byte hex (openssl rand -hex 32); encrypts the
#                           JWT signing keys at rest (AES-256-GCM)
#   LEDGERCORE_ACME_EMAIL   email for Let's Encrypt registration
#   POSTGRES_PASSWORD       strong random superuser password
#   Per-role DB passwords (R-003) — generate one random value PER ROLE
#   (openssl rand -hex 24) so a repo-known "*_dev" value can never reach a
#   public host. Fail-closed: compose refuses to render if any is unset.
#     LEDGERCORE_MIGRATOR_PASSWORD
#     LEDGERCORE_LEDGER_RT_PASSWORD
#     LEDGERCORE_IDENTITY_RT_PASSWORD
#     LEDGERCORE_RECON_RT_PASSWORD
#     LEDGERCORE_WEBHOOKS_RT_PASSWORD
#     LEDGERCORE_BLOG_RT_PASSWORD
#   LEDGERCORE_BLOG_HASH_SALT   random salt for blog visitor/author hashes
#   LEDGERCORE_BLOG_ADMIN_TOKEN operator secret for the /moderation panel
#
# Hardening baked in (services refuse to start otherwise):
#   - LEDGERCORE_ENV=sandbox-public in every Go service
#   - JWT auth mandatory (AUTH_DISABLED=false everywhere)
#   - identity rejects an empty or dev-default admin token
#   - only the gateway publishes ports (80/443); no service or DB port,
#     no Traefik dashboard
#   - per-IP rate limits + HTTPS via Let's Encrypt (TLS challenge)

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set a strong postgres password}"
      # R-003: per-role passwords are REQUIRED on a public host. The base file
      # defaults these to "*_dev"; overriding them here with ${VAR:?} means the
      # stack fail-closes (compose config/up abort) unless the operator supplies
      # a random value per role — so NO repo-known password is ever created.
      LEDGERCORE_MIGRATOR_PASSWORD: "${LEDGERCORE_MIGRATOR_PASSWORD:?set a random migrator password (openssl rand -hex 24)}"
      LEDGERCORE_LEDGER_RT_PASSWORD: "${LEDGERCORE_LEDGER_RT_PASSWORD:?set a random ledger runtime password}"
      LEDGERCORE_IDENTITY_RT_PASSWORD: "${LEDGERCORE_IDENTITY_RT_PASSWORD:?set a random identity runtime password}"
      LEDGERCORE_RECON_RT_PASSWORD: "${LEDGERCORE_RECON_RT_PASSWORD:?set a random recon runtime password}"
      LEDGERCORE_WEBHOOKS_RT_PASSWORD: "${LEDGERCORE_WEBHOOKS_RT_PASSWORD:?set a random webhooks runtime password}"
      LEDGERCORE_BLOG_RT_PASSWORD: "${LEDGERCORE_BLOG_RT_PASSWORD:?set a random blog runtime password}"
    ports: !override []

  nats:
    ports: !override []

  gateway:
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${LEDGERCORE_ACME_EMAIL:?set the ACME contact email}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # No dashboard, no insecure API on a public host.
    environment:
      LEDGERCORE_DOMAIN: "${LEDGERCORE_DOMAIN:?set the public domain}"
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik-dynamic.sandbox.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt_data:/letsencrypt

  ledger-core:
    environment:
      LEDGERCORE_ENV: "sandbox-public"
      LEDGERCORE_AUTH_DISABLED: "false"
    ports: !override []

  identity:
    environment:
      LEDGERCORE_ENV: "sandbox-public"
      LEDGERCORE_AUTH_DISABLED: "false"
      LEDGERCORE_ADMIN_TOKEN: "${LEDGERCORE_ADMIN_TOKEN:?set a strong admin token (openssl rand -hex 32)}"
      LEDGERCORE_MASTER_KEY: "${LEDGERCORE_MASTER_KEY:?set the signing-key master key (openssl rand -hex 32)}"
      LEDGERCORE_SANDBOX_SIGNUPS_PER_DAY: "${LEDGERCORE_SANDBOX_SIGNUPS_PER_DAY:-20}"
      LEDGERCORE_SANDBOX_SWEEP_INTERVAL: "${LEDGERCORE_SANDBOX_SWEEP_INTERVAL:-1h}"
    ports: !override []

  reconciliation:
    environment:
      LEDGERCORE_ENV: "sandbox-public"
      LEDGERCORE_AUTH_DISABLED: "false"
    ports: !override []

  webhooks:
    environment:
      LEDGERCORE_ENV: "sandbox-public"
      LEDGERCORE_AUTH_DISABLED: "false"
      # R-002: webhooks refuses to start in sandbox-public without a master key
      # (it encrypts subscription secrets at rest). REQUIRED here, same as
      # identity, so the base dev default can never reach a public host.
      LEDGERCORE_MASTER_KEY: "${LEDGERCORE_MASTER_KEY:?set the signing-key master key (openssl rand -hex 32)}"
    ports: !override []

  console:
    environment:
      # Server-side fetches go through the internal gateway port; the
      # browser talks to the public domain (same origin, /v1/*).
      NEXT_PUBLIC_API_URL: "https://${LEDGERCORE_DOMAIN:?set the public domain}"
      BLOG_DATABASE_URL: "postgres://ledgercore_blog_rt:${LEDGERCORE_BLOG_RT_PASSWORD:?set a random blog runtime password}@postgres:5432/ledgercore?sslmode=disable"
      BLOG_HASH_SALT: "${LEDGERCORE_BLOG_HASH_SALT:?set a random blog hash salt (openssl rand -hex 32)}"
      BLOG_ADMIN_TOKEN: "${LEDGERCORE_BLOG_ADMIN_TOKEN:?set a random blog moderation token (openssl rand -hex 32)}"
    ports: !override []

volumes:
  letsencrypt_data:
