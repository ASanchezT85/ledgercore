openapi: 3.1.0
info:
  title: LedgerCore Identity API
  version: 1.0.0
  description: |
    Tenant registry, API key management, token issuance (EdDSA JWT) and the
    JWKS used by every service to validate tokens.

    Tenant and API key management endpoints are bootstrap/admin endpoints
    gated by the `X-Admin-Token` shared secret (LEDGERCORE_ADMIN_TOKEN); when
    no admin token is configured they answer 503 `service_unavailable`. Token
    issuance and the JWKS are public.

    Issued tokens are EdDSA (Ed25519) JWTs with these claims:
      - `tenant_id`: tenant UUID
      - `env`: `sandbox` | `live` (the API key's environment)
      - `scopes`: string array, currently always `["ledger:read", "ledger:write"]`
      - standard registered claims (`sub` = API key id, `iat`, `exp`; TTL 15 minutes)
servers:
  - url: http://localhost:8082
    description: Local development (direct)
  - url: http://localhost:8080
    description: Local development (via gateway; paths are routed unchanged)
tags:
  - name: Tenants
  - name: ApiKeys
  - name: Auth

paths:
  /v1/tenants:
    post:
      operationId: createTenant
      tags: [Tenants]
      summary: Create a tenant
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
            examples:
              acme:
                value:
                  name: Acme Payments
                  slug: acme
      responses:
        '201':
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
              examples:
                acme:
                  value:
                    id: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
                    name: Acme Payments
                    slug: acme
                    status: active
                    created_at: '2026-07-24T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: A tenant with that slug already exists (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': { $ref: '#/components/responses/AdminDisabled' }
    get:
      operationId: listTenants
      tags: [Tenants]
      summary: List tenants
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Page of tenants, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/AdminDisabled' }

  /v1/tenants/{id}:
    get:
      operationId: getTenant
      tags: [Tenants]
      summary: Get a tenant
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AdminDisabled' }

  /v1/api-keys:
    post:
      operationId: createApiKey
      tags: [ApiKeys]
      summary: Create an API key
      description: The plaintext secret is returned exactly once, on creation.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
            examples:
              sandboxKey:
                value:
                  tenant_id: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
                  environment: sandbox
                  name: ci-sandbox
      responses:
        '201':
          description: API key created; includes the one-time secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
              examples:
                sandboxKey:
                  value:
                    id: b2c3d4e5-f6a7-7b8c-0d1e-2f3a4b5c6d7e
                    tenant_id: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
                    environment: sandbox
                    name: ci-sandbox
                    key_prefix: lk_sandbox_9f8e
                    secret: lk_sandbox_9f8e7d6c5b4a3f2e1d0c
                    created_at: '2026-07-24T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AdminDisabled' }

  /v1/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [ApiKeys]
      summary: Revoke an API key
      description: Revoking an already-revoked key is a no-op (still 204).
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Key revoked.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AdminDisabled' }

  /v1/auth/token:
    post:
      operationId: issueToken
      tags: [Auth]
      summary: Exchange an API key for a JWT
      description: |
        Exchanges the plaintext API key secret (the `lk_...` string returned
        on key creation) for a short-lived EdDSA JWT. Every failure mode —
        unknown key, revoked key, suspended tenant — answers the same 401
        `unauthorized`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              additionalProperties: false
              properties:
                api_key:
                  type: string
                  description: The full plaintext key secret (starts with `lk_`).
            examples:
              exchange:
                value:
                  api_key: lk_sandbox_9f8e7d6c5b4a3f2e1d0c
      responses:
        '200':
          description: Short-lived EdDSA JWT (TTL 15 minutes).
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: integer
                    description: Seconds until expiry.
              examples:
                token:
                  value:
                    access_token: eyJhbGciOiJFZERTQSIsImtpZCI6ImtleS0xIn0...
                    token_type: Bearer
                    expires_in: 900
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Unknown key, wrong secret, revoked key or inactive tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badCredentials:
                  value:
                    error:
                      code: unauthorized
                      message: api key is unknown, revoked, or its tenant is not active
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  /.well-known/jwks.json:
    get:
      operationId: getJWKS
      tags: [Auth]
      summary: Public signing keys (JWKS)
      description: 'Served with `Cache-Control: public, max-age=300`.'
      security: []
      responses:
        '200':
          description: RFC 7517 key set with Ed25519 (OKP) keys.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kty, crv, kid, x]
                      properties:
                        kty:
                          type: string
                          const: OKP
                        crv:
                          type: string
                          const: Ed25519
                        kid:
                          type: string
                        x:
                          type: string
                          description: base64url-encoded 32-byte public key.
              examples:
                jwks:
                  value:
                    keys:
                      - kty: OKP
                        crv: Ed25519
                        kid: key-2026-07
                        x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo

components:
  securitySchemes:
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: |
        Bootstrap admin shared secret (LEDGERCORE_ADMIN_TOKEN). A wrong or
        missing value answers 401 `invalid_admin_token`; if the service has
        no admin token configured, admin endpoints answer 503 `service_unavailable`.

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageLimit:
      name: limit
      in: query
      description: Page size; values above 200 are clamped to 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: cursor
      in: query
      description: |
        Opaque keyset cursor from a previous page's next_cursor. A malformed
        cursor yields 400 invalid_cursor.
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid input (`validation_failed`) or malformed pagination cursor (`invalid_cursor`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials (`unauthorized`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AdminDisabled:
      description: Admin endpoints are disabled because LEDGERCORE_ADMIN_TOKEN is not configured (`service_unavailable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable error code (snake_case). Catalog:
                validation_failed, invalid_cursor, unauthorized, forbidden,
                not_found, conflict, idempotency_conflict,
                unbalanced_transaction, insufficient_funds, rate_limited,
                service_unavailable, internal.
            message:
              type: string
            request_id:
              type: string
              description: Correlation id of the request (also in X-Request-Id).
    NextCursor:
      type: [string, 'null']
      description: |
        Opaque cursor for the next page; null when there are no more
        results (the last page never requires an extra empty fetch).

    Environment:
      type: string
      enum: [sandbox, live]

    TenantCreate:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 255
          description: URL-safe unique identifier of the tenant.

    Tenant:
      type: object
      required: [id, name, slug, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active, suspended]
        created_at:
          type: string
          format: date-time

    ApiKeyCreate:
      type: object
      required: [tenant_id, environment, name]
      additionalProperties: false
      properties:
        tenant_id:
          type: string
          format: uuid
        environment:
          $ref: '#/components/schemas/Environment'
        name:
          type: string
          minLength: 1
          maxLength: 255

    ApiKey:
      type: object
      required: [id, tenant_id, environment, name, key_prefix, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        environment:
          $ref: '#/components/schemas/Environment'
        name:
          type: string
        key_prefix:
          type: string
          description: First characters of the secret, for display/lookup.
        created_at:
          type: string
          format: date-time

    ApiKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Full plaintext key (`lk_<env>_...`). Shown exactly once; store it securely.
