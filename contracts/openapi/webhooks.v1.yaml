openapi: 3.1.0
info:
  title: LedgerCore Webhooks API
  version: 1.0.0
  description: |
    Outbound webhook subscriptions. Deliveries are HMAC-SHA256 signed with
    the subscription secret (header X-LedgerCore-Signature) and retried with
    exponential backoff (5 attempts, then `dead`). The payload is the
    standard event envelope.

    Routes live under `/v1/webhook-subscriptions` and `/v1/webhook-deliveries`
    (the gateway routes those prefixes to this service). The tenant is
    derived from the JWT; in the `live` environment endpoint URLs must be
    HTTPS.
servers:
  - url: http://localhost:8084
    description: Local development (direct)
  - url: http://localhost:8080
    description: Local development (via gateway)
security:
  - bearerAuth: []
tags:
  - name: Subscriptions
  - name: Deliveries

paths:
  /v1/webhook-subscriptions:
    post:
      operationId: createSubscription
      tags: [Subscriptions]
      summary: Create a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
            examples:
              posted:
                value:
                  url: https://api.acme.example/hooks/ledgercore
                  event_types: ['ledger.transaction.posted', 'ledger.transaction.reversed']
      responses:
        '201':
          description: Subscription created; the signing secret is returned exactly once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionWithSecret'
              examples:
                posted:
                  value:
                    id: a7b8c9d0-e1f2-7a3b-5c6d-7e8f9a0b1c2d
                    url: https://api.acme.example/hooks/ledgercore
                    event_types: ['ledger.transaction.posted', 'ledger.transaction.reversed']
                    active: true
                    created_at: '2026-07-24T12:00:00Z'
                    secret: whsec_4f3e2d1c0b9a
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: listSubscriptions
      tags: [Subscriptions]
      summary: List subscriptions
      responses:
        '200':
          description: Subscriptions (without secrets, no pagination).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscription'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/webhook-subscriptions/{id}:
    get:
      operationId: getSubscription
      tags: [Subscriptions]
      summary: Get a subscription
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateSubscription
      tags: [Subscriptions]
      summary: Update a subscription
      description: |
        Partial update. There is no delete endpoint: deactivate a
        subscription with `active: false` (it stops receiving events and can
        be re-activated later).
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                url:
                  type: string
                  format: uri
                event_types:
                  type: array
                  items:
                    $ref: '#/components/schemas/EventType'
                active:
                  type: boolean
            examples:
              pause:
                value:
                  active: false
      responses:
        '200':
          description: Updated subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/webhook-subscriptions/{id}/rotate-secret:
    post:
      operationId: rotateSubscriptionSecret
      tags: [Subscriptions]
      summary: Rotate the signing secret
      description: Generates a new secret and returns it exactly once.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: New secret.
          content:
            application/json:
              schema:
                type: object
                required: [id, secret]
                properties:
                  id:
                    type: string
                    format: uuid
                  secret:
                    type: string
              examples:
                rotated:
                  value:
                    id: a7b8c9d0-e1f2-7a3b-5c6d-7e8f9a0b1c2d
                    secret: whsec_0a1b2c3d4e5f
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/webhook-deliveries:
    get:
      operationId: listDeliveries
      tags: [Deliveries]
      summary: List deliveries
      parameters:
        - name: subscription_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DeliveryStatus'
        - name: cursor
          in: query
          description: Opaque keyset cursor from a previous page.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Page of deliveries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Delivery'
                  next_cursor:
                    type: [string, 'null']
                    description: Opaque cursor for the next page; null when exhausted.
              examples:
                page:
                  value:
                    data:
                      - id: b8c9d0e1-f2a3-7b4c-6d7e-8f9a0b1c2d3e
                        subscription_id: a7b8c9d0-e1f2-7a3b-5c6d-7e8f9a0b1c2d
                        event_id: 01890a5d-ac96-774b-bcce-b302099a8057
                        event_type: ledger.transaction.posted
                        payload: { event_id: 01890a5d-ac96-774b-bcce-b302099a8057, type: ledger.transaction.posted }
                        status: delivered
                        attempts: 1
                        next_attempt_at: '2026-07-24T12:05:00Z'
                        last_status_code: 200
                        last_error: null
                        created_at: '2026-07-24T12:05:00Z'
                        delivered_at: '2026-07-24T12:05:01Z'
                    next_cursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/webhook-deliveries/{id}/retry:
    post:
      operationId: retryDelivery
      tags: [Deliveries]
      summary: Retry a failed or dead delivery
      description: Re-enqueues the delivery as `pending` for immediate retry.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The delivery, re-enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The delivery is not in a retryable state (only failed or dead).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                conflict:
                  value:
                    error:
                      code: conflict
                      message: delivery is not in a retryable state (only failed or dead)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        EdDSA JWT issued by the identity service. Claims: `tenant_id` (UUID),
        `env` (`sandbox` | `live`), `scopes` (string array).

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Malformed request (`invalid_request`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials (`missing_token`, `invalid_token`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found for this tenant (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code (snake_case).
            message:
              type: string

    EventType:
      type: string
      enum:
        - ledger.transaction.posted
        - ledger.transaction.reversed
        - ledger.hold.created
        - ledger.hold.captured
        - ledger.hold.released
        - recon.discrepancy.detected
        - '*'
      description: Canonical event topics; `*` subscribes to every event type.

    DeliveryStatus:
      type: string
      enum: [pending, delivered, failed, dead]
      description: |
        Lifecycle: pending -> delivered, or pending -> failed (retrying with
        backoff) -> dead after 5 attempts. A manual retry re-enqueues
        failed/dead as pending.

    SubscriptionCreate:
      type: object
      required: [url, event_types]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Absolute http(s) URL. HTTPS is mandatory in the live environment.
        event_types:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EventType'

    Subscription:
      type: object
      required: [id, url, event_types, active, created_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/EventType'
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    SubscriptionWithSecret:
      allOf:
        - $ref: '#/components/schemas/Subscription'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: HMAC-SHA256 signing secret. Shown exactly once (on create and rotate).

    Delivery:
      type: object
      required:
        [id, subscription_id, event_id, event_type, payload, status, attempts,
         next_attempt_at, last_status_code, last_error, created_at, delivered_at]
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_type:
          $ref: '#/components/schemas/EventType'
        payload:
          type: object
          description: The signed event envelope exactly as sent to the endpoint.
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        attempts:
          type: integer
        next_attempt_at:
          type: string
          format: date-time
        last_status_code:
          type: [integer, 'null']
        last_error:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        delivered_at:
          type: [string, 'null']
          format: date-time
