# Standalone pnpm root for the console app.

# Flat node_modules (no symlinks). Next.js standalone output tracing fails on
# Windows without the symlink privilege (EPERM) when the isolated layout is
# used. Hoisted works on every platform.
nodeLinker: hoisted

# sharp ships a native binary and needs its postinstall script approved.
allowBuilds:
  sharp: true
  # vue-demi (transitive via @scalar/api-reference) has a harmless postinstall
  # switcher; we don't run Vue 2, so the script is not needed.
  vue-demi: false
