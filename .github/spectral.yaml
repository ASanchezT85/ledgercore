# Spectral ruleset for the LedgerCore OpenAPI contracts (LC-010).
# Starts from the built-in OpenAPI 3.x rules. A couple of documentation-only
# warnings are silenced so the gate output stays focused on real contract
# defects (dangling $refs, invalid schemas, malformed operations), which
# spectral reports at "error" severity.
extends: ["spectral:oas"]
rules:
  # Contact/license live in the repo README, not in every spec header.
  info-contact: off
  info-license: off
  # Human-readable descriptions are nice-to-have, not a merge gate.
  operation-description: off
  operation-tag-defined: off
