# LedgerCore CI: one Go job per module (matrix), a web build for the
# console, and a syntax validation of the compose stack.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - libs/go
          - services/ledger-core
          - services/identity
          - services/reconciliation
          - services/webhooks
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Mandatory anti-leak gate (blueprint §14, Fase 1a): the RLS contract test
  # runs against a real Postgres provisioned exactly like production (app
  # role with NOBYPASSRLS + per-service schemas + goose migrations). No
  # continue-on-error: a cross-tenant leak must block the merge.
  rls-contract:
    name: rls contract (ledger-core + postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ledgercore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgercore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: services/ledger-core/go.sum

      - name: Provision app role and schemas (init SQL)
        run: psql "postgres://postgres:postgres@localhost:5432/ledgercore" -v ON_ERROR_STOP=1 -f infra/postgres/init/01-init.sql

      - name: Run integration tests (migrations run inside the test harness)
        working-directory: services/ledger-core
        env:
          LEDGERCORE_TEST_DATABASE_URL: "postgres://ledgercore_app:ledgercore_dev@localhost:5432/ledgercore?search_path=ledger"
        run: |
          go test ./internal/adapters/postgres/ -run TestRLSCrossTenantIsolation -v
          go test ./... -count=1

  web:
    name: web (apps/console)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm build

  compose-validate:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f infra/compose/docker-compose.yml config -q
