# LedgerCore CI: one Go job per module (matrix), a web build for the
# console, and a syntax validation of the compose stack.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - libs/go
          - services/ledger-core
          - services/identity
          - services/reconciliation
          - services/webhooks
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Mandatory anti-leak + integration gate (blueprint §14, Fase 1a). Runs the
  # Postgres integration + RLS tests of ALL FOUR services against a real
  # Postgres provisioned exactly like production: schemas owned by the migrator,
  # per-service NOBYPASSRLS runtime roles, goose migrations applied as the
  # migrator, and grants.sql applied afterwards so the SECURITY DEFINER purge
  # functions are owned by ledgercore_maint (this is what UN-skips the LC-004
  # purge test — see R-005/R-009). Tests connect as the migrator; FORCE ROW
  # LEVEL SECURITY makes tenant policies apply even to the owner, so a
  # cross-tenant leak still fails the gate. No continue-on-error.
  pg-integration:
    name: postgres integration (${{ matrix.svc.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc:
          - { name: ledger-core,    schema: ledger,   dir: services/ledger-core/internal/adapters/postgres/migrations }
          - { name: identity,       schema: identity, dir: services/identity/internal/adapters/postgres/migrations }
          - { name: reconciliation, schema: recon,    dir: services/reconciliation/internal/adapters/postgres/migrations }
          - { name: webhooks,       schema: webhooks, dir: services/webhooks/internal/adapters/postgres/migrations }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ledgercore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgercore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # init/01-init.sql reads role passwords from the environment via psql
      # \getenv (R-003). CI uses the dev defaults on a throwaway database.
      LEDGERCORE_MIGRATOR_PASSWORD: ledgercore_migrator_dev
      LEDGERCORE_LEDGER_RT_PASSWORD: ledgercore_ledger_rt_dev
      LEDGERCORE_IDENTITY_RT_PASSWORD: ledgercore_identity_rt_dev
      LEDGERCORE_RECON_RT_PASSWORD: ledgercore_recon_rt_dev
      LEDGERCORE_WEBHOOKS_RT_PASSWORD: ledgercore_webhooks_rt_dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: services/${{ matrix.svc.name }}/go.sum

      # Unified harness convention (R-009): the service's TestMain provisions the
      # full role model itself via pgx (roles + schema + goose migrate as the
      # migrator + the grants.sql step) given only a SUPERUSER DSN, then runs the
      # integration/RLS/purge suite as the service's NOBYPASSRLS runtime role. No
      # psql, no goose CLI, no init/grants SQL executed in the workflow — this is
      # byte-for-byte what scripts/ci-local.sh runs, so CI and local are the same
      # gate. The postgres service starts empty; each matrix leg has its own DB.
      - name: Integration + RLS + purge tests (harness provisions the real role model)
        working-directory: services/${{ matrix.svc.name }}
        env:
          LEDGERCORE_TEST_ADMIN_URL: "postgres://postgres:postgres@localhost:5432/ledgercore"
        run: go test ./internal/adapters/postgres/... -count=1 -v

  # Infra role-model gate (LC-014 / LC-002). Provisions the init SQL and proves
  # the privilege boundaries directly: a runtime role can DML its own schema but
  # cannot run DDL, cannot touch a sibling schema, and cannot escalate to the
  # maintenance role. Pure psql — no service code involved.
  role-separation:
    name: postgres role separation (init SQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ledgercore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgercore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 01-init.sql reads every role password from the environment via psql
      # \getenv (R-003). Without these the script cannot even CREATE ROLE:
      # the psql variable stays undefined and the statement is a syntax error.
      LEDGERCORE_MIGRATOR_PASSWORD: ledgercore_migrator_dev
      LEDGERCORE_LEDGER_RT_PASSWORD: ledgercore_ledger_rt_dev
      LEDGERCORE_IDENTITY_RT_PASSWORD: ledgercore_identity_rt_dev
      LEDGERCORE_RECON_RT_PASSWORD: ledgercore_recon_rt_dev
      LEDGERCORE_WEBHOOKS_RT_PASSWORD: ledgercore_webhooks_rt_dev
    steps:
      - uses: actions/checkout@v4

      - name: Provision roles and schemas (init SQL)
        run: psql "postgres://postgres:postgres@localhost:5432/ledgercore" -v ON_ERROR_STOP=1 -f infra/postgres/init/01-init.sql

      - name: Runtime role is NOSUPERUSER + NOBYPASSRLS
        run: |
          psql "postgres://postgres:postgres@localhost:5432/ledgercore" -tAc \
            "SELECT bool_and(NOT rolsuper AND NOT rolbypassrls) FROM pg_roles WHERE rolname LIKE 'ledgercore_%_rt'" \
            | grep -qx t

      - name: Runtime role CANNOT run DDL in its own schema
        run: |
          M="postgres://ledgercore_migrator:ledgercore_migrator_dev@localhost:5432/ledgercore"
          RT="postgres://ledgercore_ledger_rt:ledgercore_ledger_rt_dev@localhost:5432/ledgercore"
          psql "$M" -v ON_ERROR_STOP=1 -c "SET search_path=ledger; CREATE TABLE t(id int, tenant_id uuid);"
          if psql "$RT" -c "SET search_path=ledger; CREATE TABLE hax(id int);" 2>/dev/null; then
            echo "::error::runtime role was able to CREATE a table — DDL not revoked"; exit 1
          fi
          # DML on the migrator-created table must work (default privileges).
          psql "$RT" -v ON_ERROR_STOP=1 -c "SET search_path=ledger; INSERT INTO t VALUES (1, gen_random_uuid()); SELECT count(*) FROM t;"

      - name: Runtime role CANNOT read a sibling schema
        run: |
          M="postgres://ledgercore_migrator:ledgercore_migrator_dev@localhost:5432/ledgercore"
          RT="postgres://ledgercore_ledger_rt:ledgercore_ledger_rt_dev@localhost:5432/ledgercore"
          psql "$M" -v ON_ERROR_STOP=1 -c "SET search_path=identity; CREATE TABLE secrets(id int);"
          if psql "$RT" -c "SELECT * FROM identity.secrets;" 2>/dev/null; then
            echo "::error::runtime role read a sibling schema — cross-schema not revoked"; exit 1
          fi

      - name: Runtime role CANNOT escalate to the maintenance role
        run: |
          RT="postgres://ledgercore_ledger_rt:ledgercore_ledger_rt_dev@localhost:5432/ledgercore"
          if psql "$RT" -c "SET ROLE ledgercore_maint;" 2>/dev/null; then
            echo "::error::runtime role escalated to ledgercore_maint"; exit 1
          fi


  web:
    name: web (apps/console)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm build

  compose-validate:
    name: compose config
    runs-on: ubuntu-latest
    # Dummy values so the hardened overlay (which uses ${VAR:?}) renders.
    # These are only for `config` validation — never a real deployment.
    env:
      LEDGERCORE_DOMAIN: sandbox.example.test
      LEDGERCORE_ACME_EMAIL: ops@example.test
      LEDGERCORE_ADMIN_TOKEN: ci-dummy-admin-token
      LEDGERCORE_MASTER_KEY: ci-dummy-master-key
      POSTGRES_PASSWORD: ci-dummy-postgres
      LEDGERCORE_MIGRATOR_PASSWORD: ci-dummy-migrator
      LEDGERCORE_LEDGER_RT_PASSWORD: ci-dummy-ledger
      LEDGERCORE_IDENTITY_RT_PASSWORD: ci-dummy-identity
      LEDGERCORE_RECON_RT_PASSWORD: ci-dummy-recon
      LEDGERCORE_WEBHOOKS_RT_PASSWORD: ci-dummy-webhooks
    steps:
      - uses: actions/checkout@v4

      - name: Validate base compose file
        run: docker compose -f infra/compose/docker-compose.yml config -q

      - name: Validate public sandbox overlay
        run: |
          docker compose \
            -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.sandbox.yml config -q


  # Secret scanning (LC-003): fail the PR if a credential is committed. Runs on
  # the full history of the checkout so a secret introduced and later "removed"
  # is still caught. The packaging script (scripts/export-clean.sh) runs the
  # same tool before emitting an archive.
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Allowlist documented example creds + encryption test fixtures; real
          # source/config/.env leaks still fail. Same config export-clean uses.
          GITLEAKS_CONFIG: .gitleaks.toml

  # OpenAPI anti-drift gate (LC-010). The contracts in contracts/openapi/ are
  # the single source of truth; apps/console/public/openapi/ holds committed
  # copies that the console's prebuild syncs. This job (a) lints the specs and
  # (b) fails if the committed copies diverge from the source — the exact drift
  # a prebuild can silently hide inside a PR.
  contracts:
    name: openapi lint + anti-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # BLOCKING: validates structure, dangling $refs and invalid schemas.
      # Uses Redocly rather than Spectral: Spectral 6's JSONPath engine (nimma)
      # crashes on valid OpenAPI 3.1 documents that carry null example values
      # (e.g. next_cursor: null on the last page). Redocly validates the same
      # defects LC-010 cares about without that crash. A lint error blocks.
      - name: Lint OpenAPI (redocly)
        run: |
          for f in contracts/openapi/*.yaml; do
            npx --yes @redocly/cli@1 lint "$f" --format=stylish
          done

      - name: Fail on contract/console drift
        run: |
          set -e
          drift=0
          for src in contracts/openapi/*.yaml; do
            copy="apps/console/public/openapi/$(basename "$src")"
            if [ ! -f "$copy" ]; then
              echo "::error::missing console copy for $src ($copy)"
              drift=1
            elif ! diff -q "$src" "$copy" >/dev/null; then
              echo "::error::$copy is out of sync with $src (run the console prebuild and commit)"
              diff -u "$src" "$copy" || true
              drift=1
            fi
          done
          # Also fail if the console carries a spec that no longer exists in contracts/.
          for copy in apps/console/public/openapi/*.yaml; do
            src="contracts/openapi/$(basename "$copy")"
            if [ ! -f "$src" ]; then
              echo "::error::$copy has no source in contracts/openapi/"
              drift=1
            fi
          done
          exit $drift
