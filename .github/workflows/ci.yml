# LedgerCore CI: one Go job per module (matrix), a web build for the
# console, and a syntax validation of the compose stack.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - libs/go
          - services/ledger-core
          - services/identity
          - services/reconciliation
          - services/webhooks
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  web:
    name: web (apps/console)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm build

  compose-validate:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f infra/compose/docker-compose.yml config -q
