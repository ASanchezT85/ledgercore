# LedgerCore CI: one Go job per module (matrix), a web build for the
# console, and a syntax validation of the compose stack.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - libs/go
          - services/ledger-core
          - services/identity
          - services/reconciliation
          - services/webhooks
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Mandatory anti-leak gate (blueprint §14, Fase 1a): the RLS contract test
  # runs against a real Postgres provisioned exactly like production (schemas
  # owned by the migrator + per-service NOBYPASSRLS runtime roles + goose
  # migrations). The test harness applies migrations and then queries over the
  # same connection, so it runs as the migrator; FORCE ROW LEVEL SECURITY in
  # the migrations makes the tenant policies apply even to the owner, so a
  # cross-tenant leak still fails the gate. No continue-on-error.
  rls-contract:
    name: rls contract (ledger-core + postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ledgercore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgercore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: services/ledger-core/go.sum

      - name: Provision app role and schemas (init SQL)
        run: psql "postgres://postgres:postgres@localhost:5432/ledgercore" -v ON_ERROR_STOP=1 -f infra/postgres/init/01-init.sql

      - name: Run integration tests (migrations run inside the test harness)
        working-directory: services/ledger-core
        env:
          LEDGERCORE_TEST_DATABASE_URL: "postgres://ledgercore_migrator:ledgercore_migrator_dev@localhost:5432/ledgercore?search_path=ledger"
        run: |
          go test ./internal/adapters/postgres/ -run TestRLSCrossTenantIsolation -v
          go test ./... -count=1

  # Infra role-model gate (LC-014 / LC-002). Provisions the init SQL and proves
  # the privilege boundaries directly: a runtime role can DML its own schema but
  # cannot run DDL, cannot touch a sibling schema, and cannot escalate to the
  # maintenance role. Pure psql — no service code involved.
  role-separation:
    name: postgres role separation (init SQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ledgercore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgercore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Provision roles and schemas (init SQL)
        run: psql "postgres://postgres:postgres@localhost:5432/ledgercore" -v ON_ERROR_STOP=1 -f infra/postgres/init/01-init.sql

      - name: Runtime role is NOSUPERUSER + NOBYPASSRLS
        run: |
          psql "postgres://postgres:postgres@localhost:5432/ledgercore" -tAc \
            "SELECT bool_and(NOT rolsuper AND NOT rolbypassrls) FROM pg_roles WHERE rolname LIKE 'ledgercore_%_rt'" \
            | grep -qx t

      - name: Runtime role CANNOT run DDL in its own schema
        run: |
          M="postgres://ledgercore_migrator:ledgercore_migrator_dev@localhost:5432/ledgercore"
          RT="postgres://ledgercore_ledger_rt:ledgercore_ledger_rt_dev@localhost:5432/ledgercore"
          psql "$M" -v ON_ERROR_STOP=1 -c "SET search_path=ledger; CREATE TABLE t(id int, tenant_id uuid);"
          if psql "$RT" -c "SET search_path=ledger; CREATE TABLE hax(id int);" 2>/dev/null; then
            echo "::error::runtime role was able to CREATE a table — DDL not revoked"; exit 1
          fi
          # DML on the migrator-created table must work (default privileges).
          psql "$RT" -v ON_ERROR_STOP=1 -c "SET search_path=ledger; INSERT INTO t VALUES (1, gen_random_uuid()); SELECT count(*) FROM t;"

      - name: Runtime role CANNOT read a sibling schema
        run: |
          M="postgres://ledgercore_migrator:ledgercore_migrator_dev@localhost:5432/ledgercore"
          RT="postgres://ledgercore_ledger_rt:ledgercore_ledger_rt_dev@localhost:5432/ledgercore"
          psql "$M" -v ON_ERROR_STOP=1 -c "SET search_path=identity; CREATE TABLE secrets(id int);"
          if psql "$RT" -c "SELECT * FROM identity.secrets;" 2>/dev/null; then
            echo "::error::runtime role read a sibling schema — cross-schema not revoked"; exit 1
          fi

      - name: Runtime role CANNOT escalate to the maintenance role
        run: |
          RT="postgres://ledgercore_ledger_rt:ledgercore_ledger_rt_dev@localhost:5432/ledgercore"
          if psql "$RT" -c "SET ROLE ledgercore_maint;" 2>/dev/null; then
            echo "::error::runtime role escalated to ledgercore_maint"; exit 1
          fi

  web:
    name: web (apps/console)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm build

  compose-validate:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f infra/compose/docker-compose.yml config -q

  # Secret scanning (LC-003): fail the PR if a credential is committed. Runs on
  # the full history of the checkout so a secret introduced and later "removed"
  # is still caught. The packaging script (scripts/export-clean.sh) runs the
  # same tool before emitting an archive.
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # OpenAPI anti-drift gate (LC-010). The contracts in contracts/openapi/ are
  # the single source of truth; apps/console/public/openapi/ holds committed
  # copies that the console's prebuild syncs. This job (a) lints the specs and
  # (b) fails if the committed copies diverge from the source — the exact drift
  # a prebuild can silently hide inside a PR.
  contracts:
    name: openapi lint + anti-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # BLOCKING: validates structure, dangling $refs and invalid schemas.
      # Uses Redocly rather than Spectral: Spectral 6's JSONPath engine (nimma)
      # crashes on valid OpenAPI 3.1 documents that carry null example values
      # (e.g. next_cursor: null on the last page). Redocly validates the same
      # defects LC-010 cares about without that crash. A lint error blocks.
      - name: Lint OpenAPI (redocly)
        run: |
          for f in contracts/openapi/*.yaml; do
            npx --yes @redocly/cli@1 lint "$f" --format=stylish
          done

      - name: Fail on contract/console drift
        run: |
          set -e
          drift=0
          for src in contracts/openapi/*.yaml; do
            copy="apps/console/public/openapi/$(basename "$src")"
            if [ ! -f "$copy" ]; then
              echo "::error::missing console copy for $src ($copy)"
              drift=1
            elif ! diff -q "$src" "$copy" >/dev/null; then
              echo "::error::$copy is out of sync with $src (run the console prebuild and commit)"
              diff -u "$src" "$copy" || true
              drift=1
            fi
          done
          # Also fail if the console carries a spec that no longer exists in contracts/.
          for copy in apps/console/public/openapi/*.yaml; do
            src="contracts/openapi/$(basename "$copy")"
            if [ ! -f "$src" ]; then
              echo "::error::$copy has no source in contracts/openapi/"
              drift=1
            fi
          done
          exit $drift
