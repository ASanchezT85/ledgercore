version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /libs/go
      - /services/ledger-core
      - /services/identity
      - /services/reconciliation
      - /services/webhooks
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /apps/console
    schedule:
      interval: weekly
    groups:
      npm-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
